  :root {
    --bg: #17181c;
    --panel: #202127;
    --panel-2: #26272e;
    --border: #35363f;
    --text: #eceef2;
    --text-dim: #9a9ca6;
    --accent: #6c8cff;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 32px;
    gap: 20px;
  }

  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 4px 0 0;
    color: var(--text);
    text-align: center;
  }

  .stage {
    width: 100%;
    max-width: 480px;
    background:
      linear-gradient(45deg, #2a2b32 25%, transparent 25%) 0 0/20px 20px,
      linear-gradient(-45deg, #2a2b32 25%, transparent 25%) 0 0/20px 20px,
      linear-gradient(45deg, transparent 75%, #2a2b32 75%) 0 0/20px 20px,
      linear-gradient(-45deg, transparent 75%, #2a2b32 75%) 0 0/20px 20px;
    background-color: #1c1d22;
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #preview {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.45));
  }

  .panel {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 8px; }

  .field label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }

  input[type="text"], textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    font-family: inherit;
    line-height: 1.4;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

  textarea {
    resize: none;
    overflow-y: auto;
    min-height: 100px;
    box-sizing: border-box;
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .preset {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 2px solid var(--border);
    padding: 0;
    cursor: pointer;
  }
  .preset:active { transform: scale(0.94); }

  #randomBtn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--text);
    border: 2px solid var(--border);
    font-size: 16px;
    padding: 0;
    line-height: 1;
  }

  .segmented {
    display: flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }

  .seg-btn {
    flex: 1;
    background: transparent;
    color: var(--text-dim);
    border-radius: 7px;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 600;
  }

  .seg-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .row { display: flex; gap: 10px; align-items: stretch; }

  .color-swatch-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
  }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 40px;
    height: 40px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 8px; overflow: hidden; }
  input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 8px; }
  input[type="color"]::-moz-color-swatch { border: 1px solid var(--border); border-radius: 8px; }

  #hexInput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    padding: 0;
    font-size: 15px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    outline: none;
  }

  button {
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 11px 16px;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.97); }

  #sizeVal {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  #exportBtn {
    background: var(--accent);
    color: #fff;
    width: 100%;
    padding: 13px 16px;
    font-size: 16px;
  }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.4;
  }
</style>

      const [, , l] = rgbToHsl(sd[i], sd[i+1], sd[i+2]);
      const [r, g, b] = hslToRgb(th, ts, l);
      od[i] = r; od[i+1] = g; od[i+2] = b; od[i+3] = a;
    }
    recolorCtx.putImageData(out, 0, 0);
    return { h: th, s: ts };
  }

  function wrapParagraph(context, text, maxWidth) {
    const words = text.split(/\s+/).filter(Boolean);
    if (words.length === 0) return [''];
    const lines = [];
    let line = words[0];
    for (let i = 1; i < words.length; i++) {
      const test = line + ' ' + words[i];
      if (context.measureText(test).width > maxWidth && line.length > 0) {
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    lines.push(line);
    return lines;
  }

  // Splits on explicit newlines from the textarea first, then word-wraps each paragraph
  function wrapText(context, text, maxWidth) {
    const paragraphs = text.split('\n');
    let lines = [];
    paragraphs.forEach(p => {
      lines = lines.concat(wrapParagraph(context, p, maxWidth));
    });
    return lines;
  }

  // Measures whether text at a given font size fits vertically inside the mask's bounding box
  function measureFit(fontSize, text) {
    textCtx.font = fontSize + 'px Darkshift';
    const maxWidth = maskBBox.w * 0.92;
    const lines = wrapText(textCtx, text, maxWidth);
    const lineHeight = fontSize * 1.15;
    const totalHeight = lines.length * lineHeight;
    const availableHeight = maskBBox.h * 0.9;
    return { lines, lineHeight, totalHeight, fits: totalHeight <= availableHeight };
  }

  // Only shrinks the font size when the text at the chosen size doesn't fit;
  // otherwise the user's chosen size is used as-is. When it doesn't fit, picks
  // the largest size (down to a minimum) that does fit.
  function fitFontSize(desiredSize, text) {
    if (!text) return { size: desiredSize, lines: [], lineHeight: desiredSize * 1.15 };
    let size = desiredSize;
    let m = measureFit(size, text);
    if (m.fits) return { size, lines: m.lines, lineHeight: m.lineHeight };
    const MIN_SIZE = 6;
    while (size > MIN_SIZE) {
      size--;
      m = measureFit(size, text);
      if (m.fits) break;
    }
    return { size, lines: m.lines, lineHeight: m.lineHeight };
  }

  function drawText(desiredFontSize, textColorHex) {
    textCtx.clearRect(0, 0, W, H);
    const text = textInput.value;
    if (!text) return;

    const fit = fitFontSize(desiredFontSize, text);
    const { lines, lineHeight } = fit;

    textCtx.font = fit.size + 'px Darkshift';
    textCtx.textBaseline = 'middle';
    textCtx.textAlign = 'center';
    textCtx.fillStyle = textColorHex;

    const totalHeight = lines.length * lineHeight;
    const cx = maskBBox.x + maskBBox.w / 2;
    let startY = maskBBox.y + maskBBox.h / 2 - totalHeight / 2 + lineHeight / 2;

    lines.forEach((ln, i) => {
      textCtx.fillText(ln, cx, startY + i * lineHeight);
    });

    // Clip text to the mask's allowed area
    textCtx.globalCompositeOperation = 'destination-in';
    textCtx.drawImage(maskImg, 0, 0);
    textCtx.globalCompositeOperation = 'source-over';
  }

  function render() {
    if (!ready) return;
    const hex = colorInput.value;
    const { h: th, s: ts } = recolorPaper(hex);

    // Tinted text color: same hue/sat, lightness depends on light/dark mode
    const textL = textMode === 'light' ? 0.90 : 0.10;
    const textS = textMode === 'light' ? Math.min(Math.max(ts, 0.2), 0.55) : Math.max(ts, 0.35);
    const [tr, tg, tb] = hslToRgb(th, textS, textL);
    const textColor = 'rgb(' + tr + ',' + tg + ',' + tb + ')';

    const fontSize = parseInt(sizeInput.value, 10);
    drawText(fontSize, textColor);

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(recolorCanvas, 0, 0);
    ctx.drawImage(textCanvas, 0, 0);
  }

  function updateHexLabel() {
    hexInput.value = colorInput.value.toUpperCase();
  }

  function isValidHex(v) {
    return /^#?[0-9A-Fa-f]{6}$/.test(v.trim());
  }

  function normalizeHex(v) {
    v = v.trim();
    if (!v.startsWith('#')) v = '#' + v;
    return v;
  }

  hexInput.addEventListener('input', () => {
    if (isValidHex(hexInput.value)) {
      colorInput.value = normalizeHex(hexInput.value);
      render();
    }
  });

  hexInput.addEventListener('blur', () => {
    if (isValidHex(hexInput.value)) {
      hexInput.value = normalizeHex(hexInput.value).toUpperCase();
    } else {
      updateHexLabel();
    }
  });


  function randomColor() {
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);
    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    colorInput.value = hex;
    updateHexLabel();
    render();
  }

  function autoGrow() {
    requestAnimationFrame(() => {
      textInput.style.height = 'auto';
      const border = textInput.offsetHeight - textInput.clientHeight;
      textInput.style.height = (textInput.scrollHeight + border) + 'px';
    });
  }

  textInput.addEventListener('input', () => { autoGrow(); render(); });
  colorInput.addEventListener('input', () => { updateHexLabel(); render(); });
  sizeInput.addEventListener('input', () => {
    sizeVal.textContent = sizeInput.value;
    render();
  });
  const presetBtns = document.querySelectorAll('.preset');
  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      colorInput.value = btn.dataset.color;
      updateHexLabel();
      render();
    });
  });

  randomBtn.addEventListener('click', randomColor);

  textModeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      textMode = btn.dataset.mode;
      textModeBtns.forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });

  exportBtn.addEventListener('click', () => {
    canvas.toBlob(function (blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sticker.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  updateHexLabel();
  autoGrow();

  // Ensure the pixel font is actually loaded before first render (fonts load async)
  if (document.fonts && document.fonts.load) {
    document.fonts.load('32px Darkshift').then(render).catch(() => {});
    document.fonts.ready.then(render);
  }
})();
</script>
</body>
</html>
